<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stella's Kitchen">
  <!-- Full-bleed background required for maskable icons: platform crops this
       shape (circle, squircle, rounded-square) so content must stay inside
       the safe zone (inner ~80%, i.e. a 40px margin on each side at 512). -->
  <rect x="0" y="0" width="512" height="512" fill="#EF2F2F"/>

  <text
    x="256" y="256"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="900"
    font-size="170"
    fill="#FFFFFF"
    letter-spacing="2"
  >SK</text>
</svg>
